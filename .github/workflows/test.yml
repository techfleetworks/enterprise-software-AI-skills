# Runs the discriminating tests for the repo's own gate scripts (claim-lint, arch-gate, ...), then
# runs the architecture gate against this repo itself. These scripts ARE the mechanical enforcement
# engines; if they regress, every skill that leans on them quietly loses its guarantee, so their
# tests are a required, blocking check. ADR-0015 added the second step: the repo now holds its own
# code and docs to the same gate it ships, so house-style and script-hygiene drift cannot merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: the tests only need to read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lower bound (engines.node) and current, so a fix that relies on a newer Node is caught.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The arch-gate/claim-lint scripts are dependency-free; the BDD gates use the official
      # @cucumber/gherkin parser (a devDependency), so install from the committed lockfile.
      - name: Install
        run: npm ci
      - name: Run gate-script tests
        run: npm test
      # The architecture gate holds THIS repo to its own rules (house style + script hygiene).
      # Dependency-free; exits non-zero on any violation, which fails the required check (ADR-0015).
      - name: Architecture gate
        run: npm run check:architecture

  # The verbatim gate (ADR-0018) compares each own-words per-sheet file against the EXACT upstream OWASP text,
  # which is CC-BY-SA-4.0 and therefore NOT committed (it is gitignored and fetched on demand). So this gate,
  # unlike the dependency-free ones above, needs a network fetch first and runs in its own job on a single Node.
  # Order matters: vendor the source, THEN run the gate. If the fetch is unavailable the vendored dir is absent
  # or empty and the gate exits 2 (fail closed), failing this check rather than passing vacuously.
  owasp-verbatim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Vendor the upstream OWASP source (CC-BY-SA-4.0, gitignored)
        run: npm run vendor:owasp
      - name: Verbatim-overlap gate
        run: npm run check:verbatim

  # Executable BDD (ADR-0091). The validation gates (gherkin-valid, tags, coverage) prove the .feature
  # files are well-formed, fully tagged, in sync with the datastore, and append-only; then bdd-run.mjs
  # EXECUTES the scenarios and check-bdd-executed reconciles the Cucumber JSON against the datastore, so
  # "every scenario ran and passed" is proven, not assumed. Needs the @cucumber/gherkin parser (installed
  # by npm ci) and origin/main for the append-only log base, so it fetches full history.
  bdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Gherkin syntax gate
        run: node .claude/skills/bdd-comprehensive-testing/scripts/check-gherkin-valid.mjs features
      - name: BDD tag taxonomy gate
        run: node .claude/skills/bdd-comprehensive-testing/scripts/check-bdd-tags.mjs features
      - name: BDD coverage + append-only gate
        run: |
          git show origin/main:features/bdd-coverage-log.md > "$RUNNER_TEMP/base-log.md" 2>/dev/null || true
          BDD_LOG_BASE="$RUNNER_TEMP/base-log.md" node .claude/skills/bdd-comprehensive-testing/scripts/check-bdd-coverage.mjs features
      - name: Run the scenarios and reconcile (executable)
        run: npm run test:bdd

# Runs the discriminating tests for the repo's own gate scripts (claim-lint, arch-gate, ...), then
# runs the architecture gate against this repo itself. These scripts ARE the mechanical enforcement
# engines; if they regress, every skill that leans on them quietly loses its guarantee, so their
# tests are a required, blocking check. ADR-0015 added the second step: the repo now holds its own
# code and docs to the same gate it ships, so house-style and script-hygiene drift cannot merge.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege: the tests only need to read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Lower bound (engines.node) and current, so a fix that relies on a newer Node is caught.
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The arch-gate/claim-lint scripts are dependency-free; the BDD gates use the official
      # @cucumber/gherkin parser (a devDependency), so install from the committed lockfile.
      - name: Install
        run: npm ci
      - name: Run gate-script tests
        run: npm test
      # The architecture gate holds THIS repo to its own rules (house style + script hygiene).
      # Dependency-free; exits non-zero on any violation, which fails the required check (ADR-0015).
      - name: Architecture gate
        run: npm run check:architecture
